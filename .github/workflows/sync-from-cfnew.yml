name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          
          request = urllib.request.Request(
              "https://api.github.com/repos/byJoey/cfnew/releases/latest",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "cfnew-release-sync",
              },
          )
          for attempt in range(1, 5):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      release = json.load(response)
                  if not isinstance(release, dict):
                      raise ValueError("发布信息不是 JSON 对象")
                  version = release.get("tag_name")
                  if not isinstance(version, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", version):
                      raise ValueError("发布信息缺少有效版本号")
                  assets = release.get("assets")
                  if not isinstance(assets, list):
                      raise ValueError("发布信息缺少文件列表")
                  matches = [a for a in assets if isinstance(a, dict) and a.get("name") == "Pages.zip"]
                  if len(matches) != 1:
                      raise ValueError("发布信息未包含唯一的 Pages.zip")
                  download_url = matches[0].get("browser_download_url")
                  if not isinstance(download_url, str) or not re.fullmatch(
                      r"https://github\.com/byJoey/cfnew/releases/download/[A-Za-z0-9._~%+/-]+/Pages\.zip", download_url
                  ):
                      raise ValueError("Pages.zip 下载地址无效")
                  break
              except urllib.error.HTTPError as error:
                  reason = "GitHub API HTTP " + str(error.code)
                  if error.code not in (403, 408, 429) and error.code < 500:
                      raise SystemExit("::error::" + reason) from None
              except (urllib.error.URLError, http.client.HTTPException, TimeoutError, OSError, ValueError) as error:
                  reason = "GitHub API 响应无效或连接失败 (" + type(error).__name__ + ")"
              if attempt == 4:
                  raise SystemExit("::error::获取最新发布失败，已尝试 4 次：" + reason)
              print("第 " + str(attempt) + " 次获取未成功，稍后重试：" + reason, flush=True)
              time.sleep(3 * 2 ** (attempt - 1))
          
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")
              output.write("download_url=" + download_url + "\n")
              output.write("file_name=Pages.zip\n")
          print("最新版本: " + version)
          print("文件名: Pages.zip")
          PY
      
      - name: 检查当前版本
        id: check_version
        run: |
          # 读取当前记录的版本，如果文件不存在则创建空文件
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi
          
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # 如果版本文件不存在或为空，或者版本不同，则需要更新
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi
          
          echo "正在下载文件: $FILE_NAME"
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          
          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi
          
          echo "下载成功: $FILE_NAME"
          
          # 解压缩 Pages.zip
          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .
          
          if [ $? -ne 0 ]; then
            echo "错误：解压缩失败"
            exit 1
          fi
          
          echo "解压缩成功"
          
          # 删除 zip 文件（可选，如果不需要保留）
          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"
          
          # 确保创建或更新版本记录文件
          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi
          
          # 写入版本号
          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"
          
          # 验证文件是否成功写入
          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi
      
      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi
      
      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi

